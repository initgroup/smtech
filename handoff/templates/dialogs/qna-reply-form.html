<!-- @template dialogs/qna-reply-form | @owner publisher -->
<form id="rms-qna-reply-form" class="rms-qna-form" data-id="{{id}}" data-question-id="{{questionId}}" data-requirement-key="qna-detail">
  {{{privacyHtml}}}
  <label>등록 종류 <select name="kind"><option value="comment"{{{commentSelected}}}>댓글</option><option value="answer"{{{answerSelected}}}>답변</option></select></label>
  <p>담당자의 답변에는 ‘담당자 답변’을 표시합니다. 회원·비회원 답변은 일반 답변으로 구분합니다.</p>
  <div><p><strong>댓글·답변 내용</strong></p><div data-board-editor></div><textarea name="body" maxlength="10000" required aria-label="댓글 또는 답변 내용 일반텍스트"></textarea></div>
  {{{credentialHtml}}}
  <section class="rms-privacy-highlight" data-board-preview hidden aria-live="polite"></section>
  <div class="rms-actions">{{{cancelHtml}}}{{{previewHtml}}}<button class="rms-btn rms-btn-primary" type="submit">검사 후 저장</button></div>
</form>
