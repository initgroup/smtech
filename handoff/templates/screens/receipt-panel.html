<!-- @template screens/receipt-panel | @owner publisher | @since RMS-PUB-20261008-01 | presenter: presenters/views.js#receiptPanel -->
<section class="rms-panel rms-receipt-panel">
  <div class="rms-panelhead">
  <h2>XML 수신 정보</h2>
  <a href="#mydata/{{bundleId}}">전체 리포트 페이지 ›</a>
  </div>
  <p class="rms-muted">첨부된 개인·기업 신청 및 우대가점 수신 샘플입니다. 수신 확인과 사업 적격성 검토는 별도입니다.</p>
  <div class="rms-fieldgrid rms-cols2 rms-space">
  <div class="rms-field">
  <label for="rms-mydata-bundle">신청서 조회에 사용할 수신 묶음</label>
  <select id="rms-mydata-bundle"{{{value}}}>{{{itemsHtml}}}</select>
  </div>
  <div class="rms-receipt-apply">
  <span>선택된 묶음: <strong>{{label}}</strong>
  </span>{{{value2}}}</div>
  </div>
  <p class="rms-muted">03 접수서류 확인에서 동의한 뒤 사업자등록증명의 상호·대표자·주소·사업자번호를 반영할 수 있습니다.</p>
  <div class="rms-actions rms-space">{{{itemsHtml2}}}</div>
  <p class="rms-muted rms-space">우대가점은 리포트에서 증빙값과 유효기간을 검토하세요. 재조회는 같은 수신 파일을 다시 확인합니다.</p>
  </section>
