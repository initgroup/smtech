<!-- @template dialogs/qna-unlock | @owner publisher -->
<form id="rms-qna-unlock-form" class="rms-qna-form">
  <p>비공개 글을 작성할 때 발급된 글 번호와 비회원 비밀번호를 입력하세요. 로그인한 회원의 글은 본인 계정으로 확인합니다.</p>
  <label>글 번호 <input name="questionId" maxlength="80" required autocomplete="off"></label>
  <label>비회원 비밀번호 <input type="password" name="password" minlength="10" maxlength="128" autocomplete="current-password"></label>
  <div class="rms-actions">{{{cancelHtml}}}<button class="rms-btn rms-btn-primary" type="submit">작성자 확인</button></div>
</form>
