<form id="rms-supplement-form" data-id="{{id}}">
  <div class="rms-field">
  <label for="rms-reason">보완 요청사유 *</label>
  <textarea id="rms-reason" name="reason" required maxlength="1000" placeholder="기업이 조치할 수 있도록 보완사항을 구체적으로 입력해 주세요.">
  </textarea>
  </div>
  <p class="rms-muted rms-space">이 시연에서는 기록만 변경하며 기업에 메시지를 전송하지 않습니다.</p>
  <div class="rms-actions rms-space">
  <button class="rms-btn rms-btn-primary" type="submit">보완 요청</button>
  </div>
  </form>
